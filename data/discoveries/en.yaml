- title: "Well-posedness of Filtering Equations in Weighted Sobolev Spaces with Unbounded System Coefficients"
  authors:
    - "Zeju Sun"
    - "Songlin Zhou"
    - "Stephen S.-T. Yau"
  venue: "arXiv preprint"
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2609.03549"
    - label: "DOI"
      url: "https://doi.org/10.48550/arXiv.2609.03549"
  summary_expert: "Establishes existence and uniqueness for the robust DMZ, stochastic DMZ, and Kushner-Stratonovich equations under suitable assumptions allowing polynomially growing coefficients. Exponential weights support a variational proof, while gauge transformations connect the equations through buffered weighted Sobolev spaces. AIM assisted with identifying and testing the weight scale and organizing proof steps; the authors selected the final assumptions and verified the results."
  summary_public: "Filtering estimates a hidden system's state from noisy measurements. This work gives conditions ensuring that three central filtering equations have unique solutions even when model coefficients grow without bound. AIM helped explore mathematical tools and draft arguments, with the final results checked by the researchers."

- title: "Derivations of Generalized Moduli Algebras of Isolated Hypersurface Singularities"
  authors:
    - "Zhiwen Liu"
    - "Stephen S.-T. Yau"
  venue: "arXiv preprint"
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2608.22756"
    - label: "DOI"
      url: "https://doi.org/10.48550/arXiv.2608.22756"
  summary_expert: "Determines the difference between the dimensions of the Yau algebra and the new Yau algebra of an isolated complex hypersurface singularity in terms of the Hessian corank. The two derivation Lie algebras vanish in the Morse case; when the Hessian corank is one, the new invariant is smaller by one; otherwise their dimensions agree. In particular, equality holds when n is at least 2 and mult(f) is at least 3, proving a conjecture of Chen--Hussain--Yau--Zuo. An exact sequence with end terms given by copies of the Milnor algebra's socle explains the underlying dimension count."
  summary_public: "This work compares two algebraic measurements of the infinitesimal symmetries of an isolated hypersurface singularity. It shows that their dimensions are usually equal, with a precise one-dimensional exception controlled by the degeneracy of the Hessian, and thereby resolves a previously proposed conjecture."

- title: "Sign Embedding Quantum Algorithms for Matrix Equations and Matrix Functions"
  authors:
    - "Yanqiao Wang"
    - "Jin-Peng Liu"
  venue: "arXiv preprint"
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2604.25333"
    - label: "DOI"
      url: "https://doi.org/10.48550/arXiv.2604.25333"
  summary_expert: "Develops a sign-embedding framework for operator-output quantum algorithms targeting matrix equations and matrix functions. The approach uses augmented matrices, half-plane matrix signs, logarithmic-sinc approximations, and rebalanced shifted inverse families to handle Sylvester-type equations, Lyapunov equations, matrix square roots, matrix geometric means, and Riccati equations."
  summary_public: "This work explores quantum algorithms for difficult matrix computations that appear in scientific computing and applied mathematics. Its main contribution is a reusable framework that may help quantum computers solve several families of matrix problems more systematically."

- title: "AI Mathematician as a Partner in Advancing Mathematical Discovery -- A Case Study in Homogenization Theory"
  authors:
    - "Yuanhang Liu"
    - "Beichen Wang"
    - "Peng Li"
    - "Yang Liu"
  venue: "arXiv preprint"
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2510.26380"
    - label: "DOI"
      url: "https://doi.org/10.48550/arXiv.2510.26380"
    - label: "Blog"
      url: "/en/posts/homogenization.theory/"
  summary_expert: "Studies AIM-assisted proof development for a homogenization-theory problem. The work combines autonomous reasoning trajectories with targeted human interventions to decompose the proof, select analytical tools, validate intermediate claims, and assemble a complete argument under human oversight."
  summary_public: "This case study shows how AIM can support mathematicians on a long and technical proof. AIM helps propose reasoning steps and organize the search, while human researchers guide, check, and refine the proof to maintain mathematical rigor."
